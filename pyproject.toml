# No [build-system]: Hermes then treats the plugin as a virtual workspace member and names each
# profile's copy uniquely. With a build backend, two profiles enabling commons both declare
# hermes-commons and Hermes' `uv lock` refuses the environment.
[project]
name = "hermes-commons"
version = "0.2.1"
description = "One live skill library for every Hermes profile."
license = { text = "MIT" }
authors = [{ name = "Christopher Ko" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["commons*"]

[tool.setuptools.package-data]
commons = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The repo root is also the Hermes plugin dir, so it has an __init__.py and ruff
# names the package after the folder (hermes-commons); Hermes imports it as
# hermes_plugins.commons and pytest never imports it.
"**/__init__.py" = ["N999"]
